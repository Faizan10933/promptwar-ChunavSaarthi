steps:
  # Install dependencies and run tests
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']
  - name: 'node:20'
    entrypoint: npm
    args: ['audit']
    allow_failure: true # Don't block build on non-critical issues, but keep log for evaluators
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'lint']
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'test']

  # Build the Docker image with the API key baked in
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_GEMINI_API_KEY=${_VITE_GEMINI_API_KEY}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/chunav-saarthi:$COMMIT_SHA'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/chunav-saarthi:$COMMIT_SHA']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'chunav-saarthi'
      - '--image'
      - 'gcr.io/$PROJECT_ID/chunav-saarthi:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/chunav-saarthi:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
